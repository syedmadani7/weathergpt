<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#69d5ed"/>
      <stop offset="45%" stop-color="#168ed0"/>
      <stop offset="100%" stop-color="#06459f"/>
    </linearGradient>

    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b9e6f7"/>
    </linearGradient>

    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7a0"/>
      <stop offset="100%" stop-color="#ffc928"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="10"
        flood-opacity="0.25"
      />
    </filter>
  </defs>

  <!-- Outer white border -->
  <circle
    cx="256"
    cy="256"
    r="235"
    fill="white"
    filter="url(#shadow)"
  />

  <!-- Blue circular background -->
  <circle
    cx="256"
    cy="256"
    r="215"
    fill="url(#bg)"
  />

  <!-- Inner highlight -->
  <circle
    cx="256"
    cy="256"
    r="196"
    fill="none"
    stroke="#66d4ed"
    stroke-width="5"
    opacity="0.35"
  />

  <!-- Cloud -->
  <path
    d="
      M142 270
      C118 270 100 251 100 227
      C100 203 118 184 142 184
      C147 184 152 185 157 187
      C165 154 195 130 230 130
      C264 130 294 151 305 181
      C313 177 323 175 333 175
      C366 175 393 202 393 235
      C393 268 367 294 334 294
      L151 294
      C126 294 106 284 100 266
      Z
    "
    fill="url(#cloud)"
    stroke="#e9fbff"
    stroke-width="7"
    filter="url(#shadow)"
  />

  <!-- Cloud blue lower shading -->
  <path
    d="
      M111 254
      C127 274 145 278 170 278
      L333 278
      C355 278 374 266 385 249
      C378 279 357 294 331 294
      L151 294
      C130 294 113 278 111 254
      Z
    "
    fill="#83cbe8"
    opacity="0.55"
  />

  <!-- Lightning bolt -->
  <path
    d="
      M270 151
      L221 239
      L257 239
      L239 322
      L313 220
      L274 220
      Z
    "
    fill="url(#bolt)"
    stroke="#fff4ad"
    stroke-width="5"
    filter="url(#shadow)"
  />

  <!-- WeatherGPT text -->
  <text
    x="256"
    y="365"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="51"
    font-weight="700"
    fill="white"
  >
    WeatherGPT
  </text>

  <!-- Tagline -->
  <text
    x="256"
    y="401"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="19"
    font-weight="400"
    fill="white"
  >
    AI Weather Intelligence
  </text>
</svg>